[package]
name = "mihonban-desktop"
version = "0.2.0"
edition = "2021"
description = "Native Rust Windows client for Mihonban"
license = "AGPL-3.0-only"

[[bin]]
name = "mihonban_desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.29", default-features = false, features = ["accesskit", "glow"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
icu_collator = "2.1.1"
icu_locale = "2.1.1"
keyring = { version = "3.6", features = ["windows-native"] }
percent-encoding = "2.3"
raw-window-handle = "0.6"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "symphonia-adpcm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync"] }
url = "2.5"
webbrowser = { version = "1.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
