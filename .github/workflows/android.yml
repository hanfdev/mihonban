name: Android

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: |
          chmod +x android/gradlew
          android/gradlew -p android testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Mihonban-Android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-results
          path: android/app/build/reports
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x android/gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb shell wm size 945x1680
            adb shell wm density 420
            result=0
            android/gradlew -p android connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || result=$?
            adb exec-out run-as org.mihonban.android tar -cf - files/test-screenshots > android/app/build/device-screenshots.tar || true
            exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-results
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            android/app/build/device-screenshots.tar
