name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./pipeline[test]"
      - run: python -m pytest -q

  web:
    name: React web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  worker:
    name: Main Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            cloud/worker/package-lock.json
            cloud/web/package-lock.json
      - run: npm ci
        working-directory: cloud/web
      - run: npm run build
        working-directory: cloud/web
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run

  audio-proxy:
    name: Audio proxy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/proxy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/proxy-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run
